[Service]
# MateBook D14/D15 (Intel WAX9, e.g. NBLB-WAX9N): the sensor answers the
# FDT-down command (0x32) with a single reply, while the reference MateBook 13
# QA configuration requires two (ACK + FDT data report). With the strict proof
# enabled every capture is treated as a desync and the driver burns seconds on
# a full MCU/TLS session recovery, so enrollment/verification barely work.
# This override disables only that proof; everything else stays as shipped.
Environment=GXFP_FDT_DOWN_PROOF_QA=0
